name: Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow

      # Note: We run the smoke test against the live Modal API to verify the contract is intact.
      # WARNING: This costs real Modal GPU time. Do not run this on external forks/PRs automatically!
      - name: Run E2E Smoke Test
        run: python scripts/e2e_test.py
